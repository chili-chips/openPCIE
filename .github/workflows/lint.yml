#
# RTL lint gate: 4.build/hw_build.openXC7/run-lint.sh: eduBOS5 (the default) x4
# and x1, and PicoRV32 x4; phases tags, verilator, yosys, reset, ram, iob and
# slang. The cdc, check-timing and methodology phases need Vivado; the verible
# phase is gated in verible.yml. Tools: OSS CAD Suite 2026-11-26 for Yosys
# with the yosys-slang plugin (local lint uses openXC7 main's Yosys), and
# Verilator built from master at VERILATOR_REV (cached), the revision of the
# local runs (4.build/README.md, Tool versions), as its newer checks are not
# in the suite yet.

name: lint

on:
  push:
  pull_request:

env:
  VERILATOR_REV: v5.054-420-g1b3f232f   # git describe; built from its hash
  VERILATOR_SHA: 1b3f232f

jobs:
  run-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # 5.sim/vip/openPCIE_BFM

      - name: Install OSS CAD Suite (Yosys + yosys-slang, Verilator)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: '2026-11-26'

      - name: Cache Verilator
        id: verilator-cache
        uses: actions/cache@v6
        with:
          path: ~/verilator
          key: verilator-${{ runner.os }}-${{ env.VERILATOR_REV }}

      - name: Build Verilator ${{ env.VERILATOR_REV }}
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf flex bison help2man libfl-dev zlib1g-dev
          git clone -q --filter=blob:none https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator-src"
          cd "$RUNNER_TEMP/verilator-src"
          git checkout -q "$VERILATOR_SHA"
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install

      - name: Verilator first on PATH
        run: echo "$HOME/verilator/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          yosys -V
          verilator --version
          verilator --version | grep -q -- "$VERILATOR_REV"

      - name: run-lint (x4)
        env:
          YOSYS_ARGS: -m slang
          LINT_WORK: ${{ runner.temp }}/lint/x4
        run: bash 4.build/hw_build.openXC7/run-lint.sh tags verilator yosys reset ram iob slang

      - name: run-lint (x1)
        if: always()
        env:
          YOSYS_ARGS: -m slang
          LINT_WORK: ${{ runner.temp }}/lint/x1
          LANES: 1
        run: bash 4.build/hw_build.openXC7/run-lint.sh tags verilator yosys reset ram iob slang

      - name: run-lint (x4, PicoRV32)
        if: always()
        env:
          YOSYS_ARGS: -m slang
          LINT_WORK: ${{ runner.temp }}/lint/x4.picorv32
          CPU: picorv32
        run: bash 4.build/hw_build.openXC7/run-lint.sh tags verilator yosys reset ram iob slang

      - name: Keep the lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: ${{ runner.temp }}/lint
